 <rect x="866" y="738" width="14" height="14" rx="2" fill="#3987e5" fill-opacity=".18"/><text x="888" y="750">sampling in progress (illustrative)</text>
</g>

<!-- Evidence notes -->
<g font-size="13.5" fill="#c3c2b7">
 <text x="100" y="786"><tspan font-weight="700" fill="#f0f6fc">Measured.</tspan> Every box is a published interval enclosure from the preserved D4R2 outputs; nothing is interpolated inside a window.</text>
 <text x="100" y="808"><tspan font-weight="700" fill="#f0f6fc">Derived.</tspan> Over window 1, CLOCK_MONOTONIC gained ≈ +0.80 s relative to QPC (rate × 30 s).</text>
 <text x="100" y="830"><tspan font-weight="700" fill="#f0f6fc">Inference.</tspan> RAW/QPC staying inside the screen localizes the anomaly to the disciplined clock, not the hardware rate.</text>
 <text x="100" y="852"><tspan font-weight="700" fill="#f0f6fc">Not established.</tspan> Who set tick=10833, what reset it to 10000, or that systemd-timesyncd was the sole writer (C1: INCONCLUSIVE).</text>
 <text x="100" y="874"><tspan font-weight="700" fill="#f0f6fc">Motion.</tspan> Playback only (10× real time); boxes appear as each window closes. With animation off, the complete result is shown.</text>
 <text x="100" y="898" fill="#898781" font-size="12.5">Source: docs/timesyncd-investigation.md (D4R2 table) and docs/upstream-time-sync-status.md.</text>
</g>
</svg>
