.r-post{animation-name:r-post}@keyframes r-post{0%,78.08%{opacity:0}79.2%,100%{opacity:1}}
.s1{animation-name:s1}@keyframes s1{0%,28.85%{opacity:0}29.6%{opacity:1}39.9%{opacity:1}40.38%,100%{opacity:0}}
.s2{animation-name:s2}@keyframes s2{0%,40.38%{opacity:0}41.1%{opacity:1}51.4%{opacity:1}51.92%,100%{opacity:0}}
.s3{animation-name:s3}@keyframes s3{0%,51.92%{opacity:0}52.6%{opacity:1}63%{opacity:1}63.46%,100%{opacity:0}}
.s4{animation-name:s4}@keyframes s4{0%,63.46%{opacity:0}64.2%{opacity:1}74.5%{opacity:1}75%,100%{opacity:0}}
