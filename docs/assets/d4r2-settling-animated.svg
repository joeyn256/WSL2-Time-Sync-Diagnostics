<text x="600" y="80" text-anchor="middle" fill="#c3c2b7" font-size="15.5">Ubuntu 24.04 · WSL2 · historical experiment D4R2 · MONOTONIC and RAW rates measured against Windows QPC</text>
<text x="600" y="100" text-anchor="middle" fill="#898781" font-size="14">playback at 10× real time · every box is a published interval enclosure</text>

