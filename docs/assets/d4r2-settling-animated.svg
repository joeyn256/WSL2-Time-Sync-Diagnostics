<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',Ubuntu,'DejaVu Sans',Arial,sans-serif">
<title id="title">Service stopped is not clock settled: the D4R2 measurement</title>
<desc id="desc">Historical Ubuntu 24.04 WSL2 experiment D4R2, on a Windows QPC time axis. The systemd-timesyncd stop was confirmed, the experiment held about 60 seconds, a PRE adjtimex snapshot still showed tick 10833 and freq 2157314, then four 30-second windows measured the CLOCK_MONOTONIC rate against QPC. Window 1 was +26,665.299 to +26,724.999 ppm, outside the plus or minus 1000 ppm screen; windows 2 to 4 were within about plus or minus 33 ppm. The 120-second MONOTONIC/QPC average was +6,661.607 to +6,676.217 ppm, while RAW/QPC over 120 seconds was -6.323 to +8.190 ppm. The POST snapshot showed tick 10000 and freq -27187. Who set or reset tick is not established. Motion is playback only; every box is a published interval enclosure.</desc>
<style><![CDATA[
