.c2{animation-name:c2}@keyframes c2{0%,10%{opacity:.35}11%{opacity:1}28.85%{opacity:1}29.8%,100%{opacity:.35}}
.c3{animation-name:c3}@keyframes c3{0%,28.85%{opacity:.35}29.6%{opacity:1}31.5%{opacity:1}32.5%,100%{opacity:.35}}
.c4{animation-name:c4}@keyframes c4{0%,31.5%{opacity:.35}32.5%{opacity:1}75%{opacity:1}76%,100%{opacity:.35}}
.c5{animation-name:c5}@keyframes c5{0%,78.08%{opacity:.35}79.2%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.a{animation:none !important}}
]]></style>
