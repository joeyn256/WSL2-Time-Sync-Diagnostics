.c2{animation-name:c2}@keyframes c2{0%,8%{opacity:.35}9%{opacity:1}31.0%{opacity:1}31.8%,100%{opacity:.35}}
.c3{animation-name:c3}@keyframes c3{0%,31.0%{opacity:.35}31.8%{opacity:1}34.0%{opacity:1}35%,100%{opacity:.35}}
.c4{animation-name:c4}@keyframes c4{0%,34%{opacity:.35}35%{opacity:1}88.2%{opacity:1}89%,100%{opacity:.35}}
.c5{animation-name:c5}@keyframes c5{0%,91.0%{opacity:.35}91.8%{opacity:1}100%{opacity:1}}
