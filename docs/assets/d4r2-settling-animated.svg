 <rect x="520" y="712" width="14" height="14" rx="2" fill="#3987e5" fill-opacity=".25" stroke="#3987e5" stroke-width="2"/><text x="542" y="724">120 s average, MONOTONIC/QPC</text>
 <rect x="790" y="712" width="14" height="14" rx="2" fill="#d95926" fill-opacity=".18" stroke="#d95926" stroke-width="2"/><text x="812" y="724">120 s average, RAW/QPC</text>
 <rect x="100" y="738" width="14" height="14" rx="2" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text x="122" y="750">±1000 ppm historical screen</text>
