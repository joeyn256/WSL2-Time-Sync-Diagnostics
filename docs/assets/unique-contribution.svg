<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="620" viewBox="0 0 1380 620" role="img" aria-labelledby="title desc">
<title id="title">What Microsoft, Canonical, and this project contribute</title>
<desc id="desc">Three cards compare upstream vendor facts with this project's unique bounded findings.</desc>
<rect width="1380" height="620" rx="28" fill="#0d1117"/>
<text x="690" y="56" text-anchor="middle" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">What upstream established — and what this project adds</text>
<text x="690" y="88" text-anchor="middle" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Vendor facts, bounded measurements, and practical diagnostics answer different questions</text>
<rect x="55" y="135" width="390" height="390" rx="24" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<circle cx="105" cy="185" r="23" fill="#102b46"/><text x="105" y="193" text-anchor="middle" fill="#58a6ff" font-family="Arial" font-size="24" font-weight="700">M</text>
<text x="145" y="194" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Microsoft / WSL</text>
<text x="85" y="245" fill="#58a6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">PRIMARY-SOURCE FACTS</text>
<text x="85" y="282" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• Fixed the historical sleep/resume</text>
<text x="103" y="307" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">time-of-day problem in WSL 2.1.1</text>
<text x="85" y="347" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• Hyper-V implicit synchronization is</text>
<text x="103" y="372" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">explicitly enabled by WSL</text>
<text x="85" y="412" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• Newer timing reports remain open;</text>
<text x="103" y="437" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">no root-cause equivalence assumed</text>
<rect x="495" y="135" width="390" height="390" rx="24" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<circle cx="545" cy="185" r="23" fill="#15341f"/><text x="545" y="193" text-anchor="middle" fill="#3fb950" font-family="Arial" font-size="23" font-weight="700">U</text>
<text x="585" y="194" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Ubuntu / Canonical</text>
<text x="525" y="245" fill="#3fb950" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">PRIMARY-SOURCE FACTS</text>
<text x="525" y="282" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• Documents Hyper-V + guest-NTP</text>
<text x="543" y="307" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">as a real conflict class on WSL</text>
<text x="525" y="347" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• 24.04: timesyncd enabled by default</text>
<text x="525" y="387" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• 26.04: chrony + WSL-aware -x path</text>
<text x="543" y="412" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">avoids default guest clock control</text>
<rect x="935" y="135" width="390" height="390" rx="24" fill="#161b22" stroke="#a371f7" stroke-width="3"/>
<circle cx="985" cy="185" r="23" fill="#271b3f"/><text x="985" y="193" text-anchor="middle" fill="#a371f7" font-family="Arial" font-size="22" font-weight="700">P</text>
<text x="1025" y="194" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">This project</text>
<text x="965" y="245" fill="#a371f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">UNIQUE CONTRIBUTION</text>
<text x="965" y="282" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• Shows why “service stopped” is not</text>
<text x="983" y="307" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">equivalent to “clock settled”</text>
<text x="965" y="347" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• Preserves early bad windows instead</text>
<text x="983" y="372" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">of hiding them in long-run averages</text>
<text x="965" y="412" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">• Ships a read-only CLI with explicit</text>
<text x="983" y="437" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">uncertainty and fail-closed semantics</text>
<rect x="165" y="545" width="1050" height="50" rx="25" fill="#1b1630" stroke="#a371f7"/>
<text x="690" y="577" text-anchor="middle" fill="#d6c2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">Vendor facts explain the architecture. Project evidence explains why operational readiness still needs measurement.</text>
</svg>