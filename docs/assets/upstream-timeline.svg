<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">WSL and Ubuntu time synchronization timeline</title>
<desc id="desc">A three-lane timeline of Microsoft WSL, Ubuntu Canonical, and this project's timing investigation from 2023 through 2026.</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity="0.22"/></filter></defs>
<rect width="1500" height="760" rx="28" fill="#0d1117"/>
<text x="750" y="52" text-anchor="middle" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">How the WSL time-sync story evolved</text>
<text x="750" y="83" text-anchor="middle" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Vendor changes and project findings are related — but not interchangeable evidence</text>
<line x1="235" y1="125" x2="1410" y2="125" stroke="#30363d" stroke-width="2"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#8b949e"><text x="270" y="112">2023</text><text x="560" y="112">2024</text><text x="860" y="112">2025</text><text x="1160" y="112">2026</text></g>
<text x="55" y="205" fill="#58a6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Microsoft / WSL</text>
<text x="55" y="405" fill="#3fb950" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Ubuntu / Canonical</text>
<text x="55" y="605" fill="#a371f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">This project</text>
<line x1="235" y1="195" x2="1410" y2="195" stroke="#58a6ff" stroke-width="3" opacity="0.45"/>
<line x1="235" y1="395" x2="1410" y2="395" stroke="#3fb950" stroke-width="3" opacity="0.45"/>
<line x1="235" y1="595" x2="1410" y2="595" stroke="#a371f7" stroke-width="3" opacity="0.45"/>
<circle cx="360" cy="195" r="8" fill="#58a6ff"/><rect x="285" y="225" width="250" height="98" rx="16" fill="#161b22" stroke="#58a6ff" filter="url(#shadow)"/>
<text x="305" y="252" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">2023 · #10006</text><text x="305" y="276" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Clock-skew megathread;</text><text x="305" y="296" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">modern-standby resume bug</text>
<circle cx="610" cy="195" r="8" fill="#58a6ff"/><rect x="540" y="145" width="270" height="98" rx="16" fill="#161b22" stroke="#58a6ff" filter="url(#shadow)"/>
<text x="560" y="172" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Jan 2024 · WSL 2.1.1</text><text x="560" y="196" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Implicit SYNC mitigation;</text><text x="560" y="216" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Microsoft closed #10006</text>
<circle cx="950" cy="195" r="8" fill="#58a6ff"/><rect x="860" y="225" width="250" height="98" rx="16" fill="#161b22" stroke="#58a6ff" filter="url(#shadow)"/>
<text x="880" y="252" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">2025 · #12583</text><text x="880" y="276" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">MONOTONIC-frequency report</text><text x="880" y="296" fill="#d29922" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">open at 2026-09-24 review</text>
<circle cx="1280" cy="195" r="8" fill="#58a6ff"/><rect x="1160" y="145" width="250" height="98" rx="16" fill="#161b22" stroke="#58a6ff" filter="url(#shadow)"/>
<text x="1180" y="172" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">2026 · #40745</text><text x="1180" y="196" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Periodic-pause reports</text><text x="1180" y="216" fill="#d29922" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">no Microsoft ETA found</text>
<circle cx="680" cy="395" r="8" fill="#3fb950"/><rect x="520" y="425" width="320" height="100" rx="16" fill="#161b22" stroke="#3fb950" filter="url(#shadow)"/>
<text x="540" y="452" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Ubuntu 24.04</text><text x="540" y="476" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">systemd-timesyncd enabled by default</text><text x="540" y="496" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">alongside Hyper-V implicit sync</text>
<circle cx="1000" cy="395" r="8" fill="#3fb950"/><rect x="880" y="345" width="250" height="98" rx="16" fill="#161b22" stroke="#3fb950" filter="url(#shadow)"/>
<text x="900" y="372" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Ubuntu 25.10</text><text x="900" y="396" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">chrony becomes default</text><text x="900" y="416" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">time daemon</text>
<circle cx="1265" cy="395" r="8" fill="#3fb950"/><rect x="1135" y="425" width="285" height="118" rx="16" fill="#161b22" stroke="#3fb950" filter="url(#shadow)"/>
<text x="1155" y="452" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Apr 2026 · Ubuntu 26.04</text><text x="1155" y="476" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">WSL service exception + chrony -x</text><text x="1155" y="496" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Canonical publishes explicit</text><text x="1155" y="516" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">guest-NTP conflict guidance</text>
<circle cx="1125" cy="595" r="8" fill="#a371f7"/><rect x="900" y="625" width="300" height="100" rx="16" fill="#161b22" stroke="#a371f7" filter="url(#shadow)"/>
<text x="920" y="652" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">2026 · D4R2 finding</text><text x="920" y="676" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Service stopped; kernel state and</text><text x="920" y="696" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">early measured rate still abnormal</text>
<circle cx="1340" cy="595" r="8" fill="#a371f7"/><rect x="1210" y="545" width="210" height="98" rx="16" fill="#161b22" stroke="#a371f7" filter="url(#shadow)"/>
<text x="1230" y="572" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">2026 · v0.2</text><text x="1230" y="596" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Read-only diagnostics</text><text x="1230" y="616" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">+ uncertainty-aware analysis</text>
<text x="750" y="744" text-anchor="middle" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Later Microsoft reports are not assumed to be the same defect as #10006.</text>
</svg>