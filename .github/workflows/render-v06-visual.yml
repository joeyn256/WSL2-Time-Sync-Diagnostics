name: Render v0.6 visual audit frames

on:
  push:
    branches:
      - audit/v0.6.0-visual-frames

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Render animation checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          SVG="file://$PWD/docs/assets/three-model-timing-comparison.svg"

          render() {
            local name="$1"
            local ms="$2"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1000,846 \
              --virtual-time-budget="$ms" \
              --run-all-compositor-stages-before-draw \
              --screenshot="$PWD/visual-audit/$name.png" \
              "$SVG"
          }

          render frame-00s 150
          render frame-30s 3250
          render frame-60s 6250
          render frame-90s 9250
          render frame-120s 12250

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1000,846 \
            --force-prefers-reduced-motion \
            --run-all-compositor-stages-before-draw \
            --screenshot="$PWD/visual-audit/frame-reduced-motion.png" \
            "$SVG"

          file visual-audit/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: v0.6-visual-audit-frames
          path: visual-audit/*.png
          if-no-files-found: error
