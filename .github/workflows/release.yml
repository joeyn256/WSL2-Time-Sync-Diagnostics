name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify wheel
        shell: bash
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --no-deps "$WHEEL"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python - <<'PY'
          import os
          from importlib.metadata import version
          import wsl_time_sync

          expected = os.environ["EXPECTED_VERSION"]
          assert version("wsl2-time-sync-diagnostics") == expected
          assert wsl_time_sync.__version__ == expected
          PY
          test "$(wsl-time-sync --version)" = "wsl-time-sync ${GITHUB_REF_NAME#v}"

      - name: Attach distributions to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
