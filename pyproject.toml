[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-time-sync-guide"
version = "0.3.1"
description = "Read-only WSL2 timing diagnostics and an evidence-backed Ubuntu/Python environment guide"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["WSL2", "Ubuntu", "timing", "clock", "Python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wsl-time-sync = "wsl_time_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
